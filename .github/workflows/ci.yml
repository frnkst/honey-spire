name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go build ./cmd/installer ./cmd/shipper

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp .env.example .env
          echo "HONEYPOT_SSH_PORT=2222" >> .env
      - run: python3 -m py_compile deploy/sitecustomize.py
      - run: python3 scripts/test-cowrie-customization.py
      - name: Check installer shell syntax
        run: |
          for script in scripts/install.sh cmd/installer/install-core.sh; do
            bash -n "$script"
          done
      - run: docker compose config --quiet
      - name: Check tower and beecon compose files
        run: |
          printf 'TOWER_URL=https://tower.example.com\nBEECON_TOKEN=%s\nBEECON_NAME=ci\n' \
            "$(openssl rand -hex 32)" >> .env
          docker compose -f compose.tower.yaml config --quiet
          docker compose -f compose.beecon.yaml config --quiet
      - run: docker compose up -d --wait cowrie
      - name: Test global Cowrie admission policy
        run: |
          docker compose exec -T cowrie python -c \
            "from cowrie.core import auth; policy=auth.AuthGlobal(); accepted=[policy.checklogin(b'user', str(i).encode(), '192.0.2.' + str(i % 250)) for i in range(550)]; assert sum(accepted) == 1"
      - name: Show Cowrie diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=100 cowrie
      - if: always()
        run: docker compose down --volumes
