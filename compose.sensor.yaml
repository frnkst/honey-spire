name: neonhive

# Sensor install: honeypot only. The shipper tails cowrie's JSON log and
# POSTs new events to the hive, where they are enriched and stored.

services:
  cowrie:
    image: cowrie/cowrie:3.0.13
    restart: unless-stopped
    environment:
      PYTHONPATH: /customizations:/cowrie/cowrie-git/src
    ports:
      - "${HONEYPOT_SSH_PORT:-22}:2222"
    volumes:
      - cowrie-data:/cowrie/cowrie-git/var
      - ./deploy/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./deploy/sitecustomize.py:/customizations/sitecustomize.py:ro
    networks:
      - honeypot
    mem_limit: 160m
    mem_reservation: 96m
    cpus: 0.35
    pids_limit: 96
    ulimits:
      nofile:
        soft: 256
        hard: 256
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from cowrie.core import auth; assert hasattr(auth, 'AuthGlobal')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  shipper:
    image: ${NEON_HIVE_SHIPPER_IMAGE:-ghcr.io/frnkst/neonhive-shipper:latest}
    restart: unless-stopped
    depends_on:
      cowrie:
        condition: service_healthy
    # Host networking puts the recon sniffer in front of Docker NAT and lets
    # the decoy ports bind directly on the host.
    network_mode: host
    cap_add:
      - NET_RAW
    environment:
      HIVE_URL: ${HIVE_URL}
      SENSOR_TOKEN: ${SENSOR_TOKEN}
      SENSOR_NAME: ${SENSOR_NAME}
      COWRIE_JSON_LOG: /data/cowrie/log/cowrie/cowrie.json
      OPENCANARY_JSON_LOG: ${OPENCANARY_JSON_LOG:-}
      SENSOR_RECON: ${SENSOR_RECON:-off}
      DECOY_PORTS: ${DECOY_PORTS:-}
      RECON_EXCLUDE_PORTS: ${RECON_EXCLUDE_PORTS:-22,80,443,3001,8080}
      STATE_DIR: /data/shipper
    volumes:
      - cowrie-data:/data/cowrie:ro
      - opencanary-data:/data/opencanary:ro
      - shipper-data:/data/shipper
    mem_limit: 64m
    mem_reservation: 32m
    cpus: 0.15
    pids_limit: 32
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/shipper",
          "-healthcheck",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 2m
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"

  # Low-interaction service honeypots (MySQL, MSSQL, FTP, telnet, VNC, NTP,
  # git, RDP, redis, HTTP) enabled by the recon profile.
  opencanary:
    image: ${OPENCANARY_IMAGE:-ghcr.io/frnkst/neonhive-opencanary:latest}
    profiles: ["recon"]
    restart: unless-stopped
    ports:
      - "21:21"
      - "23:23"
      - "123:123/udp"
      - "1433:1433"
      - "3306:3306"
      - "3389:3389"
      - "5900:5900"
      - "6379:6379"
      - "9418:9418"
      - "8080:8080"
    volumes:
      - ./deploy/opencanary.conf:/etc/opencanaryd/opencanary.conf:ro
      - opencanary-data:/data
    mem_limit: 160m
    mem_reservation: 96m
    cpus: 0.30
    pids_limit: 96
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"

networks:
  honeypot:

volumes:
  cowrie-data:
  shipper-data:
  opencanary-data:
