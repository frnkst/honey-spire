[honeypot]
hostname = srv-prod-01
log_path = var/log/cowrie
state_path = var/lib/cowrie
logtype = rotating
download_path = /tmp
download_limit_size = 65536
ttylog = true
ttylog_path = ${honeypot:log_path}

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
enabled = false

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false

[output_textlog]
enabled = false
