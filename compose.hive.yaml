name: neonhive

# Hive install: dashboard + database only. Sensor honeypots ship their
# events to this server over the ingest API; no honeypot runs here.

services:
  app:
    image: ${NEON_HIVE_IMAGE:-ghcr.io/frnkst/neonhive:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEON_HIVE_MODE: hive
      DATABASE_PATH: /data/app/neonhive.db
      GEOLITE_DIR: /data/geolite
      OPENCANARY_JSON_LOG: ${OPENCANARY_JSON_LOG:-}
      SENSOR_EVENTS_LOG: ${SENSOR_EVENTS_LOG:-}
      MAXMIND_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:-}
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_HOURLY_INTERVAL_MINUTES: ${TELEGRAM_HOURLY_INTERVAL_MINUTES:-60}
      TELEGRAM_DAILY_INTERVAL_HOURS: ${TELEGRAM_DAILY_INTERVAL_HOURS:-24}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      RAW_SESSION_RETENTION_DAYS: ${RAW_SESSION_RETENTION_DAYS:-7}
    volumes:
      - app-data:/data/app
      - geolite-data:/data/geolite
      - opencanary-data:/data/opencanary:ro
      - sensor-data:/data/sensor:ro
    networks:
      - web
    mem_limit: 320m
    mem_reservation: 192m
    cpus: 0.45
    pids_limit: 96
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - web
    mem_limit: 48m
    mem_reservation: 24m
    cpus: 0.15
    pids_limit: 48
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"

  # Low-interaction service honeypots (MySQL, MSSQL, FTP, telnet, VNC, NTP,
  # git, RDP, redis, HTTP) enabled by the recon profile. A hive exposes these
  # alongside the dashboard so sensor operators still learn who scans them.
  opencanary:
    image: ${OPENCANARY_IMAGE:-ghcr.io/frnkst/neonhive-opencanary:latest}
    profiles: ["recon"]
    restart: unless-stopped
    ports:
      - "21:21"
      - "23:23"
      - "123:123/udp"
      - "1433:1433"
      - "3306:3306"
      - "3389:3389"
      - "5900:5900"
      - "6379:6379"
      - "9418:9418"
      - "8080:8080"
    volumes:
      - ./deploy/opencanary.conf:/etc/opencanaryd/opencanary.conf:ro
      - opencanary-data:/data
    networks:
      - web
    mem_limit: 160m
    mem_reservation: 96m
    cpus: 0.30
    pids_limit: 96
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"

  # Raw-socket scan detection plus decoy ports; runs on the host network so
  # the sniffer sees packets before Docker NAT. Writes events for the app to
  # tail from the shared volume.
  sensor:
    image: ${NEON_HIVE_SHIPPER_IMAGE:-ghcr.io/frnkst/neonhive-shipper:latest}
    profiles: ["recon"]
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
    environment:
      SENSOR_ROLE: sidecar
      SENSOR_RECON: "on"
      DECOY_PORTS: ${DECOY_PORTS:-5432,9200,2375,27017}
      RECON_EXCLUDE_PORTS: ${RECON_EXCLUDE_PORTS:-22,80,443,3001,8080,21,23,123,1433,3306,3389,5900,6379,9418}
      STATE_DIR: /data/shipper
      SENSOR_EVENT_LOG: /data/shipper/events.json
    volumes:
      - sensor-data:/data/shipper
    mem_limit: 64m
    mem_reservation: 32m
    cpus: 0.15
    pids_limit: 32
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/shipper",
          "-healthcheck",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 2m
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"

networks:
  web:

volumes:
  app-data:
  geolite-data:
  caddy-data:
  caddy-config:
  opencanary-data:
  sensor-data:
