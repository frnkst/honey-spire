name: honey-spire

services:
  app:
    image: ${HONEY_SPIRE_IMAGE:-ghcr.io/frnkst/honey-spire:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/app/honey-spire.db
      COWRIE_JSON_LOG: /data/cowrie/log/cowrie/cowrie.json
      COWRIE_TTY_DIR: /data/cowrie/log/cowrie
      GEOLITE_DIR: /data/geolite
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_HOURLY_INTERVAL_MINUTES: ${TELEGRAM_HOURLY_INTERVAL_MINUTES:-60}
      TELEGRAM_DAILY_INTERVAL_HOURS: ${TELEGRAM_DAILY_INTERVAL_HOURS:-24}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      RAW_SESSION_RETENTION_DAYS: ${RAW_SESSION_RETENTION_DAYS:-7}
    volumes:
      - app-data:/data/app
      - geolite-data:/data/geolite
      - cowrie-data:/data/cowrie
    networks:
      - web
    mem_limit: 320m
    mem_reservation: 192m
    cpus: 0.45
    pids_limit: 96
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  cowrie:
    image: cowrie/cowrie:3.0.13
    restart: unless-stopped
    environment:
      PYTHONPATH: /customizations:/cowrie/cowrie-git/src
    ports:
      - "${HONEYPOT_SSH_PORT:-22}:2222"
    volumes:
      - cowrie-data:/cowrie/cowrie-git/var
      - ./deploy/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./deploy/sitecustomize.py:/customizations/sitecustomize.py:ro
    networks:
      - honeypot
    mem_limit: 160m
    mem_reservation: 96m
    cpus: 0.35
    pids_limit: 96
    ulimits:
      nofile:
        soft: 256
        hard: 256
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from cowrie.core import auth; assert hasattr(auth, 'AuthGlobal')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - web
    mem_limit: 48m
    mem_reservation: 24m
    cpus: 0.15
    pids_limit: 48
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"

networks:
  web:
  honeypot:

volumes:
  app-data:
  geolite-data:
  cowrie-data:
  caddy-data:
  caddy-config:
